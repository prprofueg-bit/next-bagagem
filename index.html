<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NEXT | BAGAGEM</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root{--bg:#0a0a0b;--card:#151517;--card2:#1d1d21;--text:#f6f6f6;--muted:#a5a5ad;--line:#2d2d32;--ok:#87e0ad;--warn:#ffd166;--danger:#ff8585}
    *{box-sizing:border-box} html{background:var(--bg)} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}.app{max-width:820px;margin:auto;padding:18px 16px 110px}button{cursor:pointer}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{font-size:23px;font-weight:900;letter-spacing:.3px}.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:1.1px;margin-top:3px}.manager{border:1px solid var(--line);padding:8px 10px;border-radius:999px;color:var(--muted);font-size:12px;white-space:nowrap}
    .hero{border:1px solid var(--line);background:linear-gradient(145deg,#19191d,#101012);border-radius:24px;padding:18px}.hero h1{margin:0;font-size:21px}.hero p{color:var(--muted);margin:5px 0 0;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.stat{background:#0e0e10;border:1px solid var(--line);border-radius:15px;padding:11px}.stat b{font-size:22px;display:block}.stat span{font-size:10px;color:var(--muted)}
    .alert{display:none;margin-top:12px;border-radius:14px;padding:11px 12px;font-size:12px}.alert.show{display:block}.alert.warn{background:#211b12;border:1px solid #56421e;color:#ffdc92}.alert.ok{background:#122019;border:1px solid #29583b;color:#9de4b9}
    .title{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 10px;gap:10px}.title h2{font-size:16px;margin:0}.title span{font-size:11px;color:var(--muted)}
    .cars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.car{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px}.car h3{margin:0 0 8px;font-size:14px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;color:#ddd;background:var(--card2);border:1px solid var(--line);padding:5px 8px;border-radius:999px}
    .tabs,.filters{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tab,.filter{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px 11px;border-radius:999px;font-size:12px;white-space:nowrap}.tab.on,.filter.on{background:#f3f3f3;color:#0b0b0c;border-color:#f3f3f3}
    .person-list,.item-list{display:flex;flex-direction:column;gap:9px;margin-top:10px}.person,.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px}.person-head{display:flex;justify-content:space-between;gap:10px}.person b{font-size:14px}.sub{font-size:11px;color:var(--muted);margin-top:2px}.counts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.count{font-size:11px;border:1px solid var(--line);background:#101012;border-radius:999px;padding:5px 8px}.zero{color:var(--muted)}
    .item-top{display:flex;gap:11px;align-items:flex-start}.ico{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}.main{flex:1;min-width:0}.item-name{font-weight:800;font-size:14px}.meta{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px}.qty{border:1px solid var(--line);background:#101012;border-radius:11px;padding:6px 8px;font-size:12px;font-weight:800}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.check{border:1px solid var(--line);background:#101012;color:var(--muted);padding:9px;border-radius:12px;font-size:11px;font-weight:800}.check.on{background:var(--ok);border-color:var(--ok);color:#0a0a0b}.check.return.on{background:#f3f3f3;border-color:#f3f3f3}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:7px}.link{border:0;background:none;color:var(--muted);font-size:11px;padding:3px}.empty{text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;padding:26px 12px;margin-top:10px}
    .tools{display:flex;gap:7px;margin-top:12px}.smallbtn{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:8px 9px;border-radius:11px;font-size:11px}
    .fab{position:fixed;right:max(18px,calc((100vw - 820px)/2 + 18px));bottom:22px;background:#f3f3f3;color:#0a0a0b;border:0;border-radius:17px;padding:14px 17px;font-weight:900;box-shadow:0 15px 36px #0008}
    dialog{width:min(92vw,540px);border:1px solid var(--line);background:#121216;color:var(--text);border-radius:22px;padding:0}.modal{padding:18px}.modal h2{margin:0 0 14px;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0c0c0e;color:var(--text);border-radius:12px;padding:11px 12px;outline:none}.field textarea{min-height:72px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:10px 13px;border-radius:12px;font-weight:800}.btn.primary{background:#f3f3f3;color:#0a0a0b;border-color:#f3f3f3}
    @media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.cars{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand">NEXT | BAGAGEM<small>NEXT EXPERIENCE</small></div><div class="manager">Marta • controle</div></header>

  <section class="hero">
    <h1>Nada fica para trás.</h1>
    <p>Quem é o dono, onde está agora e o que precisa voltar.</p>
    <div class="stats">
      <div class="stat"><b id="stReg">0</b><span>REGISTROS</span></div>
      <div class="stat"><b id="stVol">0</b><span>VOLUMES</span></div>
      <div class="stat"><b id="stIda">0</b><span>IDA</span></div>
      <div class="stat"><b id="stVolta">0</b><span>VOLTA</span></div>
    </div>
    <div id="alert" class="alert"></div>
    <div class="tools"><button class="smallbtn" onclick="exportData()">Exportar backup</button><button class="smallbtn" onclick="fileInput.click()">Importar backup</button><input id="fileInput" type="file" accept="application/json" hidden onchange="importData(event)"></div>
  </section>

  <div class="title"><h2>Carros</h2><span>adultos e adolescentes</span></div>
  <div id="cars" class="cars"></div>

  <div class="title"><h2>Controle</h2><span>visão da Marta</span></div>
  <div class="tabs"><button id="tabPassenger" class="tab on" onclick="setView('passenger')">Por passageiro</button><button id="tabItems" class="tab" onclick="setView('items')">Todos os itens</button><button id="tabPending" class="tab" onclick="setView('pending')">Pendentes da volta</button></div>

  <section id="passengerView"><div id="people" class="person-list"></div></section>
  <section id="itemsView" hidden><div class="filters" id="filters" style="margin-top:10px"></div><div id="items" class="item-list"></div></section>
  <section id="pendingView" hidden><div id="pending" class="item-list"></div></section>
</div>
<button class="fab" onclick="openForm()">＋ Adicionar item</button>

<dialog id="dlg"><form method="dialog" class="modal" onsubmit="saveItem(event)">
  <h2 id="formTitle">Adicionar item</h2><input id="editId" type="hidden">
  <div class="grid">
    <div class="field"><label>Pertence a</label><select id="owner" required></select></div>
    <div class="field"><label>Carro onde o item está</label><select id="car" required></select></div>
    <div class="field"><label>Categoria</label><select id="type" required onchange="toggleObject()"><option>Mala</option><option>Mochila</option><option>Bolsa</option><option>Bag</option><option>Sacola</option><option>Caixa</option><option>Objeto</option></select></div>
    <div class="field"><label>Quantidade</label><input id="qty" type="number" min="1" value="1" required></div>
    <div id="objectField" class="field full" style="display:none"><label>Identifique o objeto</label><input id="objectName" placeholder="Ex.: violão, rádio, pedestal, extensão..."></div>
    <div class="field full"><label>Observação</label><textarea id="note" placeholder="Opcional. Ex.: porta-malas, material do louvor, caixa preta..."></textarea></div>
  </div>
  <div class="modal-actions"><button class="btn" type="button" onclick="dlg.close()">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div>
</form></dialog>

<script>
const peopleByCar={
  "Carro 1":["Uelinton","Jana","Davi Gomes","Valentina"],
  "Carro 2":["Júnior","Débora","Marta","Julia Vargas"],
  "Carro 3":["Alex Martins","Fabíola","Alex Veiga","Ana Júlia","Eloyse"],
  "Carro 4":["Deyvid","Arthur","Nicolas"]
};
const people=Object.values(peopleByCar).flat();
const homeCar=Object.fromEntries(Object.entries(peopleByCar).flatMap(([car,ps])=>ps.map(p=>[p,car])));
const categories=["Todos","Mala","Mochila","Bolsa","Bag","Sacola","Caixa","Objeto"];
const icons={Mala:"🧳",Mochila:"🎒",Bolsa:"👜",Bag:"🎸",Sacola:"🛍️",Caixa:"📦",Objeto:"🔖"};
let items=JSON.parse(localStorage.getItem("nextBagagem.items")||"[]");
let view="passenger",filter="Todos";

function safe(s){return String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function persist(){localStorage.setItem("nextBagagem.items",JSON.stringify(items));render();}
function init(){
  owner.innerHTML=people.map(p=>`<option>${safe(p)}</option>`).join("");
  car.innerHTML=Object.keys(peopleByCar).map(c=>`<option>${c}</option>`).join("");
  cars.innerHTML=Object.entries(peopleByCar).map(([c,ps])=>`<div class="car"><h3>${c}</h3><div class="chips">${ps.map(p=>`<span class="chip">${safe(p)}</span>`).join("")}</div></div>`).join("");
  filters.innerHTML=categories.map(c=>`<button class="filter ${c===filter?'on':''}" onclick="setFilter('${c}')">${c}</button>`).join("");
  render();
}
function setView(v){view=v;passengerView.hidden=v!=="passenger";itemsView.hidden=v!=="items";pendingView.hidden=v!=="pending";tabPassenger.classList.toggle("on",v==="passenger");tabItems.classList.toggle("on",v==="items");tabPending.classList.toggle("on",v==="pending");render();}
function setFilter(f){filter=f;init();}
function toggleObject(){objectField.style.display=type.value==="Objeto"?"flex":"none";}
function openForm(id){
  editId.value="";formTitle.textContent="Adicionar item";owner.value=people[0];car.value=homeCar[people[0]];type.value="Mala";qty.value=1;objectName.value="";note.value="";toggleObject();
  if(id){const x=items.find(i=>i.id===id);if(!x)return;editId.value=x.id;formTitle.textContent="Editar item";owner.value=x.owner;car.value=x.car;type.value=x.type;qty.value=x.qty;objectName.value=x.objectName||"";note.value=x.note||"";toggleObject();}
  dlg.showModal();
}
owner.addEventListener("change",()=>{if(!editId.value)car.value=homeCar[owner.value]||"Carro 1";});
function saveItem(e){e.preventDefault();const rec={owner:owner.value,car:car.value,type:type.value,qty:Math.max(1,Number(qty.value)||1),objectName:type.value==="Objeto"?(objectName.value.trim()||"Objeto"):"",note:note.value.trim()};if(editId.value){const n=items.findIndex(i=>i.id===editId.value);items[n]={...items[n],...rec};}else{items.unshift({id:crypto.randomUUID(),...rec,ida:false,volta:false,createdAt:Date.now()});}dlg.close();persist();}
function toggleCheck(id,key){const x=items.find(i=>i.id===id);if(!x)return;x[key]=!x[key];if(key==="ida"&&!x.ida)x.volta=false;persist();}
function removeItem(id){if(confirm("Excluir este item?")){items=items.filter(i=>i.id!==id);persist();}}
function itemCard(i){const label=i.type==="Objeto"?i.objectName:i.type;const different=i.car!==homeCar[i.owner];return `<article class="item"><div class="item-top"><div class="ico">${icons[i.type]}</div><div class="main"><div class="item-name">${safe(label)}</div><div class="meta">Pertence a <b>${safe(i.owner)}</b> • está no <b>${i.car}</b>${different?` • passageiro está no <b>${homeCar[i.owner]}</b>`:""}${i.note?`<br>${safe(i.note)}`:""}</div></div><div class="qty">×${i.qty}</div></div><div class="checks"><button class="check ${i.ida?'on':''}" onclick="toggleCheck('${i.id}','ida')">${i.ida?'✓ IDA':'Conferir IDA'}</button><button class="check return ${i.volta?'on':''}" ${!i.ida?'disabled':''} onclick="toggleCheck('${i.id}','volta')">${i.volta?'✓ VOLTA':'Conferir VOLTA'}</button></div><div class="actions"><button class="link" onclick="openForm('${i.id}')">Editar</button><button class="link" onclick="removeItem('${i.id}')">Excluir</button></div></article>`;}
function render(){
  stReg.textContent=items.length;stVol.textContent=items.reduce((s,i)=>s+i.qty,0);stIda.textContent=items.filter(i=>i.ida).reduce((s,i)=>s+i.qty,0);stVolta.textContent=items.filter(i=>i.volta).reduce((s,i)=>s+i.qty,0);
  const missing=items.filter(i=>i.ida&&!i.volta),missingQty=missing.reduce((s,i)=>s+i.qty,0);alert.className="alert "+(items.length?(missingQty?"show warn":"show ok"):"");alert.textContent=items.length?(missingQty?`⚠️ Ainda faltam ${missingQty} volume(s) para conferir na volta.`:"✓ Nenhum volume pendente na volta."):"";
  people.innerHTML=people.map(p=>{const mine=items.filter(i=>i.owner===p);const total=mine.reduce((s,i)=>s+i.qty,0);const chips=["Mala","Mochila","Bolsa","Bag","Sacola","Caixa","Objeto"].map(t=>{const n=mine.filter(i=>i.type===t).reduce((s,i)=>s+i.qty,0);return n?`<span class="count">${n} ${t}${n>1&&t!=="Objeto"?'s':''}</span>`:""}).join("");const away=mine.filter(i=>i.car!==homeCar[p]).length;return `<div class="person"><div class="person-head"><div><b>${safe(p)}</b><div class="sub">${homeCar[p]}${away?` • ${away} registro(s) em outro carro`:""}</div></div><b>${total}</b></div><div class="counts">${chips||'<span class="count zero">Sem bagagem cadastrada</span>'}</div></div>`;}).join("");
  const shown=filter==="Todos"?items:items.filter(i=>i.type===filter);itemsView.querySelector("#items").innerHTML=shown.length?shown.map(itemCard).join(""):'<div class="empty">Nenhum item nesta categoria.</div>';
  pending.innerHTML=missing.length?missing.map(itemCard).join(""):'<div class="empty">Nenhum item pendente para a volta.</div>';
}
function exportData(){const data={app:"NEXT | BAGAGEM",version:1,peopleByCar,exportedAt:new Date().toISOString(),items};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="next-bagagem-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw new Error();items=d.items;persist();alert("Backup importado com sucesso.");}catch{alert("Arquivo de backup inválido.");}e.target.value="";};r.readAsText(f);}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});init();
</script>
</body>
</html>
